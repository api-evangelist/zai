- aid: zai:zai-async-api
  name: Zai Asynchronous API
  description: >-
    Asynchronous API for submitting long-running operations and retrieving their
    results without blocking, complementing the synchronous Assembly API.
    OpenAPI 3.0.0, version 1.0.0, 3 documented paths, supporting OAuth2
    client-credentials and basic authentication.
  humanURL: https://developer.hellozai.com/reference/async-overview
  baseURL: https://tnq.api.assemblypay.com/
