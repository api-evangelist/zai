        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/charges'
              examples:
                response:
                  value:
                    charges:
                    - id: 4d7d73f5-c7f0-477d-aff8-7570d2c7e7d9
