name: Zai
kind: company
description: >-
  Zai (hellozai.com, formerly Assembly Payments / Assembly) is an Australian
  payments and Payments-as-a-Service provider headquartered in Melbourne. Zai
  gives platforms, marketplaces and vertical software companies a programmable
  way to onboard users, hold funds in managed wallet accounts, collect pay-ins
  (card, direct debit, BPAY, PayID), and disburse pay-outs across many parties
  in a single transaction flow. It is API-first: the Assembly API exposes wallet
  accounts, users, items, transactions, bank accounts, card accounts, fees,
  callbacks and batch disbursements, layered with Australia's New Payments
  Platform rails through dedicated Virtual Accounts / PayID and PayTo APIs, plus
  an Asynchronous API for long-running operations. Authentication is OAuth2
  client-credentials (bearer tokens on PayTo), with a Live and Pre-live
  (sandbox) environment, webhooks with signature verification, and a developer
  dashboard. Positioned as the embedded-payments and marketplace-money-movement
  layer for the Australian market and platforms operating there.
