apis:
- aid: zai:zai-assembly-api
  name: Zai Assembly API
  description: >-
    Zai's core payments platform API. Onboard users, create and manage wallet
    accounts, items (transaction records), bank and card accounts, companies,
    fees, tokens, callbacks and batch transactions to collect pay-ins and
    disburse multi-party pay-outs across a marketplace or platform. OpenAPI
    3.0.0, version 2.3, 89 documented paths, secured with OAuth2
    client-credentials.
  humanURL: https://developer.hellozai.com/reference/overview
  baseURL: https://secure.api.promisepay.com
  tags:
  - Payments
  - Wallet Accounts
  - Marketplace
  - Pay-ins
  - Payouts
  properties:
  - type: OpenAPI
    url: openapi/zai-assembly-api.json
  - type: Documentation
    url: https://developer.hellozai.com/docs
  - type: APIReference
    url: https://developer.hellozai.com/reference/overview
  - type: Authentication
    url: https://developer.hellozai.com/reference/token
- aid: zai:zai-virtual-accounts-payid-api
  name: Zai Virtual Accounts and PayIDs API
  description: >-
    Create and manage Virtual Accounts and PayIDs on the New Payments Platform
    (NPP), letting platforms receive real-time account-to-account pay-ins to
    uniquely addressable virtual accounts. OpenAPI 3.0.0, version 0.12-external,
    8 documented paths on the assemblypay.com host.
  humanURL: https://developer.hellozai.com/reference/overview-va
  baseURL: https://au-0000.api.assemblypay.com
  tags:
  - PayID
  - Virtual Accounts
  - NPP
  - Real-Time Payments
  properties:
  - type: OpenAPI
    url: openapi/zai-virtual-accounts-payid.json
  - type: Documentation
    url: https://developer.hellozai.com/reference/overview-va
  - type: APIReference
    url: https://developer.hellozai.com/reference/overview-va
- aid: zai:zai-payto-api
  name: Zai PayTo API
  description: >-
    Create and manage PayTo agreements (mandated real-time debits) and initiate
    payments against them over the New Payments Platform. OpenAPI 3.0.1, version
    1.4-external, 10 documented paths, secured with bearer-token authentication.
  humanURL: https://developer.hellozai.com/reference/overview-1
  baseURL: https://au-0000.api.assemblypay.com/payto/
  tags:
