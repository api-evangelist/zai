    primary: OAuth2 client-credentials
    tokenEndpoint: https://au-0000.auth.assemblypay.com/tokens
    sandboxTokenEndpoint: https://au-0000.sandbox.auth.assemblypay.com/tokens
    openidConfiguration: https://au-0000.auth.assemblypay.com/.well-known/openid-configuration
    payto: HTTP bearer token
    async: OAuth2 client-credentials or HTTP basic
  webhooks:
    documented: true
    signatureVerification: true
    url: https://developer.hellozai.com/docs/webhooks
  postman: false
  graphql: false
  homeMarket: Australia
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://secure.api.promisepay.com
      documented: true
      note: Core Assembly API production host; legacy promisepay.com domain per the 2.3 spec servers.
    - protocol: REST
      scheme: https
      baseURL: https://au-0000.api.assemblypay.com
      documented: true
      note: NPP Virtual Accounts / PayID and PayTo (payto/) production host.
    - protocol: REST
      scheme: https
      baseURL: https://tnq.api.assemblypay.com/
      documented: true
      note: Asynchronous API production host.
